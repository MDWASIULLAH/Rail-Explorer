  <line x1="235" y1="380" x2="140" y2="480" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  <line x1="277" y1="380" x2="372" y2="480" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />

  <!-- Train Head -->
  <path d="M188 380 L188 230 C188 150, 220 120, 256 120 C292 120, 324 150, 324 230 L324 380 Z" fill="url(#trainBodyGrad)" />
  <path d="M208 225 C208 175, 228 155, 256 155 C284 155, 304 175, 304 225 C304 235, 298 240, 285 240 L227 240 C214 240, 208 235, 208 225 Z" fill="url(#windshieldGrad)" stroke="#60a5fa" stroke-width="6" />

  <!-- Headlights -->
  <circle cx="218" cy="305" r="16" fill="#f8fafc" />
  <circle cx="294" cy="305" r="16" fill="#f8fafc" />
  <circle cx="256" cy="140" r="12" fill="#fbbf24" />

