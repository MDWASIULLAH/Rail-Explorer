<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <linearGradient id="brandBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="brandTrainBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="brandWindshieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>

  <!-- Left Icon Container (120x120) -->
  <g transform="translate(20, 20)">
    <!-- Squircle Container -->
    <rect width="120" height="120" rx="28" fill="url(#brandBgGrad)" stroke="#334155" stroke-width="2" />
    
    <!-- Outer Orbit -->
    <ellipse cx="60" cy="62" rx="46" ry="20" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" transform="rotate(-18 60 62)" />
    <circle cx="20" cy="54" r="2.5" fill="#38bdf8" />

    <!-- Tracks -->
    <line x1="48" y1="98" x2="72" y2="98" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <line x1="42" y1="105" x2="78" y2="105" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="55" y1="90" x2="32" y2="114" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="65" y1="90" x2="88" y2="114" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Train Head -->
    <path d="M44 90 L44 54 C44 35, 52 28, 60 28 C68 28, 76 35, 76 54 L76 90 Z" fill="url(#brandTrainBodyGrad)" />
    <path d="M49 53 C49 41, 53 36, 60 36 C67 36, 71 41, 71 53 C71 56, 70 57, 67 57 L53 57 C50 57, 49 56, 49 53 Z" fill="url(#brandWindshieldGrad)" stroke="#475569" stroke-width="1" />
    
    <!-- Headlights -->
    <circle cx="51" cy="72" r="3" fill="#f8fafc" />
    <circle cx="69" cy="72" r="3" fill="#f8fafc" />
    <circle cx="60" cy="33" r="2" fill="#fbbf24" />

    <!-- Pilot -->
    <path d="M46 83 L74 83 L76 90 L44 90 Z" fill="#0f172a" stroke="#334155" stroke-width="1" />

    <!-- Tricolor Ribbon -->
    <rect x="52" y="66" width="16" height="1" fill="#f97316" />
    <rect x="52" y="67" width="16" height="1" fill="#ffffff" />
    <rect x="52" y="68" width="16" height="1" fill="#22c55e" />
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(160, 42)">
    <!-- Primary Title -->
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1.5" fill="url(#textGrad)">
      Rail Explorer
    </text>

    <!-- Subtitle / Platform Tag -->
    <text x="2" y="74" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#38bdf8" text-transform="uppercase">
      Indian Railway 3D Platform
    </text>

    <!-- Live Satellite GPS Badge -->
    <g transform="translate(365, 58)">
      <rect width="90" height="20" rx="10" fill="#065f46" fill-opacity="0.3" stroke="#059669" stroke-width="1" />
      <circle cx="10" cy="10" r="3.5" fill="#34d399" />
      <text x="20" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#34d399" letter-spacing="1">
        LIVE 3D
      </text>
    </g>
  </g>
</svg>

