<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Train Body Gradient -->
    <linearGradient id="trainBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Nosecone Highlight Gradient -->
    <linearGradient id="noseGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Windshield Gradient -->
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />

  <!-- Outer Orbit / Satellite Ring (Representing GPS & 3D Space) -->
  <ellipse cx="256" cy="270" rx="190" ry="85" fill="none" stroke="#0284c7" stroke-width="3.5" stroke-dasharray="14 10" opacity="0.45" transform="rotate(-18 256 270)" />
  <circle cx="95" cy="235" r="7" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="410" cy="310" r="5" fill="#38bdf8" opacity="0.8" />

  <!-- Converging 3D Railway Track Lines (Bottom Ground) -->
  <g opacity="0.85">
    <!-- Sleepers / Ties -->
    <line x1="205" y1="410" x2="307" y2="410" stroke="#334155" stroke-width="4.5" stroke-linecap="round" />
    <line x1="185" y1="432" x2="327" y2="432" stroke="#334155" stroke-width="5.5" stroke-linecap="round" />
    <line x1="160" y1="458" x2="352" y2="458" stroke="#475569" stroke-width="7" stroke-linecap="round" />

    <!-- Steel Rails -->
    <line x1="235" y1="380" x2="140" y2="480" stroke="#64748b" stroke-width="6.5" stroke-linecap="round" />
    <line x1="277" y1="380" x2="372" y2="480" stroke="#64748b" stroke-width="6.5" stroke-linecap="round" />
    
    <!-- Neon Rail Running Glow -->
    <line x1="235" y1="380" x2="140" y2="480" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" />
    <line x1="277" y1="380" x2="372" y2="480" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" />
  </g>

  <!-- 3D Aerodynamic Train Head (WAP-7 / Vande Bharat Hybrid) -->
  <g filter="url(#dropShadow)">
    <!-- Main Shell Base -->
    <path d="M188 380 L188 230 C188 150, 220 120, 256 120 C292 120, 324 150, 324 230 L324 380 Z" fill="url(#trainBodyGrad)" />

    <!-- Aerodynamic Side Flutings (Left / Right Depth) -->
    <path d="M188 230 C188 150, 220 120, 256 120 L256 380 L188 380 Z" fill="#ffffff" opacity="0.08" />
    <path d="M256 120 C292 120, 324 150, 324 230 L324 380 L256 380 Z" fill="#000000" opacity="0.18" />

    <!-- Sleek Aerodynamic Windshield -->
    <path d="M208 225 C208 175, 228 155, 256 155 C284 155, 304 175, 304 225 C304 235, 298 240, 285 240 L227 240 C214 240, 208 235, 208 225 Z" fill="url(#windshieldGrad)" stroke="#475569" stroke-width="2.5" />
    
    <!-- Windshield Glare Reflection -->
    <path d="M222 178 C232 165, 245 160, 256 160 L256 232 L225 232 Z" fill="#38bdf8" opacity="0.25" />

    <!-- Center Nose Bevel -->
    <polygon points="256,120 270,240 256,260 242,240" fill="#60a5fa" opacity="0.4" />

    <!-- High-Power Dual Projector Headlights (Twin LEDs) -->
    <!-- Left Light -->
    <circle cx="218" cy="305" r="10" fill="#f8fafc" />
    <circle cx="218" cy="305" r="16" fill="#38bdf8" opacity="0.4" filter="url(#glow)" />
    <!-- Right Light -->
    <circle cx="294" cy="305" r="10" fill="#f8fafc" />
    <circle cx="294" cy="305" r="16" fill="#38bdf8" opacity="0.4" filter="url(#glow)" />

    <!-- Center Headlight (High Beam) -->
    <circle cx="256" cy="140" r="7" fill="#ffffff" filter="url(#glow)" />
    <circle cx="256" cy="140" r="12" fill="#fbbf24" opacity="0.5" />

    <!-- Indian Railways High-Speed Cowcatcher / Pilot Grille -->
    <path d="M200 348 L312 348 L320 380 L192 380 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Grille Bars -->
    <line x1="225" y1="352" x2="225" y2="376" stroke="#475569" stroke-width="3" />
    <line x1="245" y1="352" x2="245" y2="376" stroke="#475569" stroke-width="3" />
    <line x1="256" y1="352" x2="256" y2="376" stroke="#475569" stroke-width="3" />
    <line x1="267" y1="352" x2="267" y2="376" stroke="#475569" stroke-width="3" />
    <line x1="287" y1="352" x2="287" y2="376" stroke="#475569" stroke-width="3" />

    <!-- Indian Railways Tricolor Accent Ribbon (Subtle RDSO Stripe) -->
    <rect x="220" y="278" width="72" height="3" rx="1.5" fill="#f97316" />
    <rect x="220" y="282" width="72" height="3" rx="1.5" fill="#ffffff" />
    <rect x="220" y="286" width="72" height="3" rx="1.5" fill="#22c55e" />

    <!-- 3D Dimension Caliper Line Indicator (Top) -->
    <path d="M168 180 L158 180 L158 280 L168 280" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" />
    <path d="M344 180 L354 180 L354 280 L344 280" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" />
    <circle cx="158" cy="230" r="3" fill="#38bdf8" />
    <circle cx="354" cy="230" r="3" fill="#38bdf8" />
  </g>

  <!-- Speed Vectors (Subtle Motion Lines) -->
  <line x1="120" y1="180" x2="80" y2="210" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  <line x1="392" y1="180" x2="432" y2="210" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.4" />
</svg>

